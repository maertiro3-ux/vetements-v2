name: Build Vetements Next

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 8
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          java -version

      - name: Install Gradle 7.4.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-7.4.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp/gradle
          chmod +x /tmp/gradle/gradle-7.4.2/bin/gradle

      - name: Build with Gradle 7.4.2
        run: /tmp/gradle/gradle-7.4.2/bin/gradle build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetements-next-jar
          path: build/libs/*.jar
