name: Build Vetements Next

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 8 and set JAVA_HOME
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk
          JAVA8_HOME=$(dirname $(dirname $(readlink -f /usr/lib/jvm/java-8-openjdk-*/bin/java | head -n 1)))
          echo "JAVA_HOME=$JAVA8_HOME" >> $GITHUB_ENV
          echo "$JAVA8_HOME/bin" >> $GITHUB_PATH
          $JAVA8_HOME/bin/java -version

      - name: Fix Gradle config for Forge 1.16.5
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'Forge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }
          rootProject.name = 'vetements-next'
          EOF

          if [ -f build.gradle ]; then
            sed -i "s/\[6\.0,6\.2)/5.1.+/g" build.gradle
          fi

      - name: Install Gradle 7.6.4
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp/gradle
          chmod +x /tmp/gradle/gradle-7.6.4/bin/gradle

      - name: Build with Gradle 7.6.4
        run: /tmp/gradle/gradle-7.6.4/bin/gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetements-next-jar
          path: build/libs/*.jar
